)

<style>

body{
font-family:sans-serif;
background:#101010;
color:white;
margin:0;
padding:0;
}

header{
background:#1c1c1c;
padding:15px;
font-size:22px;
}

#queue{
padding:20px;
}

#history{
padding:20px;
background:#0b0b0b;
border-top:2px solid #333;
}

.order{
background:#222;
padding:20px;
margin-bottom:15px;
border-radius:10px;
}

.customer{
font-size:22px;
color:#4CAF50;
}

.item{
font-size:18px;
margin:4px 0;
}

.chef{
color:#ff9800;
margin-top:10px;
}

button{
margin-top:12px;
padding:10px 15px;
border:none;
border-radius:6px;
background:#2196F3;
color:white;
cursor:pointer;
}

.queueNumber{
font-size:18px;
color:#ccc;
}

.historyItem{
background:#1a1a1a;
padding:15px;
margin-bottom:10px;
border-radius:8px;
}

details summary{
cursor:pointer;
font-size:18px;
color:#aaa;

<body>

<header>
🍽 Ready To Serve
</header>

<div id="queue"></div>

<header>
📜 Serve History
</header>

<div id="history"></div>

<script>

function combineItems(items){

if(typeof items === "string"){
items = JSON.parse(items)
}

let combined={}

for(let i in items){

let name=i.replace("Extra: ","")

if(name.includes("Set")) continue

let qty=items[i].qty

if(!combined[name]) combined[name]=0

combined[name]+=qty

}

return combined

}

async function loadServe(){

const { data, error } = await supabaseClient
.from("orders")
.select("*")
.eq("status","done")
.order("time",{ascending:true})

if(error){
console.log(error)
return
}

let queue=document.getElementById("queue")

queue.innerHTML=""

data.forEach((o,index)=>{

let box=document.createElement("div")

box.className="order"

let combined=combineItems(o.items)

let items=""

for(let food in combined){

items+=`<div class="item">${food} x${combined[food]}</div>`

}

box.innerHTML=`

<div class="queueNumber">
Queue #${index+1}
</div>

<div class="customer">
👤 ${o.customer}
</div>

${items}

<div class="chef">
👨‍🍳 ${o.chef || "-"}
</div>

<button onclick="served('${o.id}')">
SERVED
</button>

`

queue.appendChild(box)

})

}

async function loadHistory(){

const { data } = await supabaseClient
.from("orders")
.select("*")
.eq("status","served")
.order("time",{ascending:false})

let history=document.getElementById("history")

history.innerHTML=""

data.forEach(o=>{

let combined=combineItems(o.items)

let items=""

for(let food in combined){

items+=`<div class="item">${food} x${combined[food]}</div>`

}

let box=document.createElement("div")

box.className="historyItem"

box.innerHTML=`

<details>

<summary>
Order ✔ ${o.customer}
</summary>

${items}

</details>

`

history.appendChild(box)

})

}

async function served(id){

await supabaseClient
.from("orders")
.update({status:"served"})
.eq("id",id)

loadServe()
loadHistory()

}

setInterval(function(){

loadServe()
loadHistory()

},2000)

loadServe()
loadHistory()

</script>

</body>
</html>
