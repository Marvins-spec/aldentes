const { createClient } = supabase

const supabaseClient = createClient(
"https://rfcmjhqxmxbrwguovarl.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJmY21qaHF4bXhicndndW92YXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2MjI4NTEsImV4cCI6MjA4OTE5ODg1MX0.8enFcMSqkfH0KqsK2txySpnq07lYp9s3b2WMdqcW7NE"
)
  
</script>

<style>
body{
font-family:sans-serif;
background:#111;
color:white;
margin:0;
}

header{
background:#1f1f1f;
padding:15px;
font-size:22px;
}

#chefName{
color:#4CAF50;
font-weight:bold;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

#orders{
flex:3;
overflow-y:auto;
padding:20px;
}

#history{
flex:1;
background:#1a1a1a;
padding:20px;
overflow-y:auto;
}

.order{
background:#222;
padding:20px;
margin-bottom:15px;
border-radius:10px;
}

.item{
font-size:18px;
margin:5px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

.accept{
background:#4CAF50;
color:white;
}

.ready{
background:#2196F3;
color:white;
}

.taken{
color:#ff9800;
margin-top:10px;
}

.historyItem{
background:#333;
padding:10px;
margin-bottom:8px;
border-radius:6px;
}
</style>
</head>

<body>

<header>
👨‍🍳 Chef: <span id="chefName"></span>
</header>

<div class="container">

<div id="orders"></div>

<div id="history">
<h3>History</h3>
</div>

</div>

<script>

let chefName=""

function loginChef(){
chefName = prompt("Enter Chef Name")

if(!chefName){
loginChef()
return
}

document.getElementById("chefName").innerText = chefName
}

loginChef()

// ===================== LOAD ORDERS =====================
async function loadOrders(){

const { data, error } = await supabaseClient
.from("orders")
.select("*")
.in("status", ["waiting","cooking"]) // ✅ สำคัญ
.order("time", { ascending: true })

if(error){
console.log(error)
return
}

const board = document.getElementById("orders")
board.innerHTML=""

data.forEach(o=>{

let items = o.items

if(typeof items === "string"){
items = JSON.parse(items)
}

let html=""

for(let i in items){

let name=i.replace("Extra: ","")

if(name.includes("Set")) continue

html+=`<div class="item">${name} x${items[i].qty}</div>`
}

let action=""

// 🟢 WAITING → แสดง ACCEPT
if(o.status==="waiting"){

action=`
<button class="accept" onclick="acceptOrder('${o.id}')">
ACCEPT
</button>
`
}

// 🔵 COOKING → แสดงชื่อเชฟ + READY เฉพาะคนรับ
else if(o.status==="cooking"){

let readyBtn = ""

if(o.chef === chefName){
readyBtn = `
<button class="ready" onclick="ready('${o.id}')">
READY
</button>
`
}

action=`
<div class="taken">👨‍🍳 ${o.chef}</div>
${readyBtn}
`
}

board.innerHTML+=`
<div class="order">
<h2>${o.customer}</h2>
${html}
${action}
</div>
`

})

}

// ===================== ACCEPT =====================
async function acceptOrder(id){

const { data } = await supabaseClient
.from("orders")
.select("status")
.eq("id", id)
.single()

if(data.status !== "waiting"){
alert("Order already taken")
return
}

await supabaseClient
.from("orders")
.update({
status:"cooking",
chef:chefName
})
.eq("id",id)

loadOrders()

}

// ===================== READY =====================
async function ready(id){

await supabaseClient
.from("orders")
.update({
status:"done"
})
.eq("id",id)

loadOrders()
loadHistory()

}

// ===================== HISTORY =====================
async function loadHistory(){

const { data, error } = await supabaseClient
.from("orders")
.select("*")
.eq("status","done") // ✅ ใช้ done
.order("time",{ascending:false})

if(error){
console.log(error)
return
}

const history=document.getElementById("history")
history.innerHTML="<h3>History</h3>"

data.forEach(o=>{

let items=o.items

if(typeof items==="string"){
items=JSON.parse(items)
}

let html=""

for(let i in items){

let name=i.replace("Extra: ","")

if(name.includes("Set")) continue

html+=`<div>${name} x${items[i].qty}</div>`
}

history.innerHTML+=`
<div class="historyItem">
<b>${o.customer}</b>
${html}
</div>
`

})

}

// ===================== AUTO REFRESH =====================
setInterval(()=>{
loadOrders()
loadHistory()
},2000)

loadOrders()
loadHistory()

</script>

</body>
</html>
