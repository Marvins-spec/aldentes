)
</script>
<style>

body{
font-family:sans-serif;
background:#111;
color:white;
margin:0;
padding:0;
}

header{
background:#1f1f1f;
padding:15px;
font-size:22px;
}

#chefName{
color:#4CAF50;
font-weight:bold;
}

.container{
display:flex;
height:calc(100vh - 60px);
}

#orders{
flex:3;
overflow-y:auto;
padding:20px;
}

#history{
flex:1;
background:#1a1a1a;
padding:20px;
overflow-y:auto;
}

.order{
background:#222;
padding:20px;
margin-bottom:15px;
border-radius:10px;
}

.order.flash{
animation:flash 1s ease-in-out 3;
}

@keyframes flash{
0%{background:#333;}
50%{background:#ff9800;}
100%{background:#333;}
}

.item{
font-size:18px;
margin:5px 0;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:10px;
}

.accept{
background:#4CAF50;
color:white;
}

.ready{
background:#2196F3;
color:white;
}

.taken{
color:#ff9800;
margin-top:10px;
}

.historyItem{
background:#333;
padding:10px;
margin-bottom:8px;
border-radius:6px;
}

#popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.popupContent{
background:#222;
padding:30px;
border-radius:10px;
width:400px;
text-align:center;
}

.popupItem{
font-size:20px;
margin:8px 0;
}

</style>
</head>

<body>

<header>
👨‍🍳 Chef: <span id="chefName"></span>
</header>

<div class="container">

<div id="orders"></div>

<div id="history">
<h3>History</h3>
</div>

</div>

<div id="popup"></div>

<script>

let chefName=""
let lastOrderCount=0

function loginChef(){

chefName=prompt("Enter Chef Name")

if(!chefName){
loginChef()
return
}

document.getElementById("chefName").innerText=chefName

}

loginChef()

async function loadOrders(){

let { data: orders, error } = await supabaseClient
.from("orders")
.select("*")
.order("time",{ascending:true})

if(error){
console.log(error)
return
}

let board=document.getElementById("orders")
board.innerHTML=""

orders.forEach((o,index)=>{

if(o.status==="done") return

let box=document.createElement("div")
box.className="order"

let items = typeof o.items === "string"
? JSON.parse(o.items)
: o.items

let combined={}

for(let i in items){

let name=i.replace("Extra: ","")

if(name.includes("Set")) continue

let qty=items[i].qty

if(!combined[name]) combined[name]=0

combined[name]+=qty

}

let itemsHTML=""

for(let food in combined){

itemsHTML+=`<div class="item">${food} x${combined[food]}</div>`

}

let action=""

if(o.status==="waiting"){

action=`<button class="accept" onclick="acceptOrder('${o.id}')">ACCEPT</button>`

}

if(o.status==="cooking"){

action=`<div class="taken">👨‍🍳 ${o.chef} cooking</div>`

}

box.innerHTML=`

<h2>Order</h2>

${itemsHTML}

${action}

`

board.appendChild(box)

})

}

autoScrollCheck(orders.length)

function autoScrollCheck(count){

if(count>lastOrderCount){

let ordersDiv=document.getElementById("orders")

ordersDiv.scrollTop=ordersDiv.scrollHeight

let last=ordersDiv.lastChild

if(last){

last.classList.add("flash")

}

}

lastOrderCount=count

}

async function acceptOrder(id){

await supabaseClient
.from("orders")
.update({
status:"cooking",
chef:chefName
})
.eq("id",id)

loadOrders()

}

function openPopup(index){

let orders=JSON.parse(localStorage.getItem("orders")||"[]")

let o=orders[index]

let combined={}

for(let i in o.items){

let name=i.replace("Extra: ","")

if(name.includes("Set")) continue

let qty=o.items[i].qty

if(!combined[name]) combined[name]=0

combined[name]+=qty

}

let items=""

for(let food in combined){

items+=`<div class="popupItem">${food} x${combined[food]}</div>`

}

let popup=document.getElementById("popup")

popup.innerHTML=`

<div class="popupContent">

<h1>Order #${index+1}</h1>

${items}

<button class="ready" onclick="ready(${index})">
READY
</button>

</div>

`

popup.style.display="flex"

}

async function ready(id){

await supabaseClient
.from("orders")
.update({
status:"done"
})
.eq("id",id)

document.getElementById("popup").style.display="none"

loadOrders()

}
loadHistory()

}function loadHistory(){

let orders=JSON.parse(localStorage.getItem("orders")||"[]")

let history=document.getElementById("history")

history.innerHTML="<h3>History</h3>"

orders.forEach((o,index)=>{

if(o.status!=="served") return

let combined={}

for(let i in o.items){

let name=i.replace("Extra: ","")

if(name.includes("Set")) continue

let qty=o.items[i].qty

if(!combined[name]) combined[name]=0

combined[name]+=qty

}

let items=""

for(let food in combined){

items+=`<div>${food} x${combined[food]}</div>`

}

let box=document.createElement("div")

box.className="historyItem"

box.innerHTML=`

<details>

<summary>
Order #${index+1} ✔ ${o.customer}
</summary>

${items}

</details>

`

history.appendChild(box)

})

}

window.addEventListener("storage",function(){

loadOrders()
loadHistory()

})

setInterval(function(){

loadOrders()
loadHistory()

},2000)

loadOrders()
loadHistory()

</script>

</body>
</html>
